<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1518" media="(prefers-color-scheme: dark)">
<title>Offline · Türkçe 365</title>
<style>
  :root { --paper:#fff; --ink:#15232a; --soft:#4c5b62; --brand:#0e5263; --accent:#f2681d; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0b1518; --ink:#e7eef0; --soft:#a3b3b9; --brand:#1f95ad; --accent:#f07a35; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  main { max-width: 380px; }
  img { width:64px; height:64px; border-radius:16px; }
  h1 { font-size: 44px; line-height: 1; letter-spacing: -0.03em; margin: 28px 0 12px; font-weight: 750; }
  p { color: var(--soft); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color:#fff; background:var(--brand); border:0; border-radius:10px; height:44px; padding:0 20px; }
  b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 lang="tr">Bağlantı yok.</h1>
  <p>You're offline. Türkçe 365 needs the internet to load your lessons and save your answers. Your progress is safe.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
